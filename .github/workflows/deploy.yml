name: Build & Deploy to gh-pages Branch & GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Grant permissions required for deploying to gh-pages branch and GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔍 Run Type Check & Linter
        run: npm run lint

      - name: 🏗️ Build Application for GitHub Pages
        run: npm run build:gh-pages

      - name: 🌿 Deploy & Push to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v5

      - name: 📂 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: 🚀 Deploy to GitHub Pages (Direct)
        id: deployment
        uses: actions/deploy-pages@v4
